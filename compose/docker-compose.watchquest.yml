name: watchquest

services:
  rss-bridge:
    image: rssbridge/rss-bridge:latest
    container_name: watchquest-rss-bridge
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - rss_bridge_config:/config

  watchquest-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: watchquest-mcp
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    stdin_open: true
    tty: true
    environment:
      WATCHQUEST_DATA_DIR: /app/data
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      LANGFUSE_BASE_URL: http://host.docker.internal:3000
    depends_on:
      - rss-bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"

  watchquest-telegram-bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: watchquest-telegram-bot
    restart: unless-stopped
    command: ["watchquest-telegram-bot"]
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    environment:
      WATCHQUEST_DATA_DIR: /app/data
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://host.docker.internal:3000}
      LANGFUSE_BASE_URL: http://host.docker.internal:3000
    depends_on:
      - rss-bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rss_bridge_config:
