[project]
name = "watchquest-mcp"
version = "0.1.0"
description = "MCP agent tools for games, movies and series recommendations from RSS sources."
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "mcp[cli]>=1.0.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.0.1",
    "langfuse>=4.0.0",
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "mem0ai>=1.0.11,<2",
    "chromadb>=1.5.9",
    "langchain-memgraph>=0.1.14",
    "rank-bm25>=0.2.2",
]

[project.scripts]
watchquest-mcp = "mcp_server.server:main"
watchquest-telegram-bot = "app.telegram_bot:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = []
allowed-confusables = ["➕", "В", "Н", "а", "б", "г", "е", "о", "р", "с", "у"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "src"
plugins = []

[[tool.mypy.overrides]]
module = ["feedparser", "mem0"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/domain", "src/llm_core", "src/mcp_server", "src/mcp_tools", "src/myshows_client", "src/rss_feeds"]
