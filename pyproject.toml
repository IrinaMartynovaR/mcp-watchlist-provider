[project]
name = "watchquest-mcp"
version = "0.1.0"
description = "MCP agent tools for games, movies and series recommendations from RSS/Feedly sources."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "langfuse>=4.0.0",
]

[project.scripts]
watchquest-mcp = "watchquest.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
