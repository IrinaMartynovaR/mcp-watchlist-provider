[project]
name = "watchquest-mcp"
version = "0.1.0"
description = "MCP agent tools for games, movies and series recommendations from RSS/Feedly sources."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "langfuse>=4.0.0",
]

[project.scripts]
watchquest-mcp = "watchquest.server:main"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "RUF",
    "SIM",
    "UP",
    "W",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["watchquest"]
