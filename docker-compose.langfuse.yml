# Langfuse compose is managed via scripts/setup-langfuse-compose.sh.
# Use the official Langfuse developer compose stack pinned to 4.5.1 by default.
#
# Suggested workflow:
#   ./scripts/setup-langfuse-compose.sh 4.5.1
#   docker compose -f vendor/langfuse/docker-compose.yml up -d
#   docker compose up -d --build
#
# Keep WatchQuest and Langfuse separate so Langfuse can be upgraded independently.
services: {}
